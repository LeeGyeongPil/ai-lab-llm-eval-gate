[project]
name = "evalgate"
version = "0.2.2"
description = "프롬프트를 바꾸면 테스트 세트로 자동 채점하고, 기준보다 떨어지면 CI를 빨갛게 만드는 작은 평가 게이트"
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []  # 런타임 의존성 없음 — 표준 라이브러리만 쓴다

[project.scripts]
evalgate = "evalgate.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
